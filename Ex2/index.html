<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reactive Task Manager</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      background: #f5f7fb;
    }

    main {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }

    input, button {
      padding: 10px;
      margin: 4px;
    }

    button {
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      background: #2459c4;
      color: white;
    }

    .task-list {
      padding-left: 24px;
    }

    .task-list li {
      margin: 12px 0;
    }

    .completed {
      text-decoration: line-through;
      color: #777;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="./test-runner.js"></script>
</body>
</html>
